# Dukcapil Service Configuration
spring.application.name=dukcapil

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Database Configuration - Database Dukcapil
spring.datasource.url=jdbc:postgresql://localhost:5432/dukcapil_ktp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS - Allow Customer Service
app.cors.allowed-origins=http://localhost:8080,http://localhost:3000

# Security - Simple untuk internal service
spring.security.user.name=dukcapil
spring.security.user.password=dukcapil123

# Logging
logging.level.com.dukcapil=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n